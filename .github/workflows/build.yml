name: PR Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [signals, geolocation]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - run: ./mvnw -pl ${{ matrix.module }} -am install
        env:
          VAADIN_PRO_KEY: ${{ secrets.VAADIN_PRO_KEY }}
