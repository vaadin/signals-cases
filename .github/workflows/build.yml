name: PR Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  prime-cache:
    name: Prime Maven cache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - run: ./mvnw -B -DskipTests dependency:go-offline
        env:
          VAADIN_PRO_KEY: ${{ secrets.VAADIN_PRO_KEY }}

  build:
    name: Build ${{ matrix.module }}
    needs: prime-cache
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [signals, geolocation]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - run: ./mvnw -pl ${{ matrix.module }} -am install
        env:
          VAADIN_PRO_KEY: ${{ secrets.VAADIN_PRO_KEY }}

  build-result:
    name: Build result
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check build matrix status
        if: needs.build.result != 'success'
        run: exit 1
