server.port=${PORT:8080}
logging.level.org.atmosphere=warn

vaadin.launch-browser=true
vaadin.allowed-packages=com.vaadin,org.vaadin,com.example
vaadin.frontend.hotdeploy=true

# UC7 external monitoring stack (see compose.yaml). Expose the Prometheus
# exposition endpoint so the stack can scrape this app.
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.prometheus.access=unrestricted
# Percentiles are computed by Prometheus from histogram buckets, so the key
# timers have to publish them; without this, a p95/p99 panel stays empty.
management.metrics.distribution.percentiles-histogram.vaadin.request.duration=true
management.metrics.distribution.percentiles-histogram.vaadin.rpc.duration=true
management.metrics.distribution.percentiles-histogram.vaadin.session.lock.wait=true
# Bucket boundaries tuned to the latency range that matters for a server-driven
# UI. The default spread puts most of its buckets in ranges a UI interaction
# never reaches, so a p95 ends up read off one very wide bucket; these place the
# resolution around the thresholds a user actually feels (the kit's own UX
# budget is 1 s). Session-lock waits get a shorter scale, since contention shows
# up in single-digit milliseconds.
management.metrics.distribution.slo.vaadin.request.duration=25ms,50ms,100ms,250ms,500ms,1s,2s
management.metrics.distribution.slo.vaadin.rpc.duration=25ms,50ms,100ms,250ms,500ms,1s,2s
management.metrics.distribution.slo.vaadin.session.lock.wait=1ms,5ms,10ms,50ms,100ms,500ms

# UC2 join-table fetch demo. Enable the Observability Kit database feature so
# every JDBC result-set fetch is recorded into the vaadin.db.fetch.rows summary
# (and a vaadin.db.query span per query, nested under the request span);
# database-statement attaches the SQL text to those spans. The N+1 then shows up
# as many small fetches in that kit meter — no application code reads the JDBC
# driver. These two stay module-wide on purpose: they only add meters and spans,
# nothing the other use cases can see, and UC2's whole point is that the kit is
# already recording this. Console SQL logging is the noisy part, so it lives in
# the opt-in sql-log profile instead (application-sql-log.properties).
vaadin.observability.database=true
vaadin.observability.database-statement=true

# UC3 capacity signals. The kit's UI-state measurement is opt-in and off by
# default, because each sampled interaction costs a walk of that UI's state
# tree; UC3 is entirely about those numbers, so the module turns it on. The
# sample interval is the throttle for re-measuring one UI on RPC completion.
vaadin.observability.ui-state=true
vaadin.observability.ui-state-sample-interval=1000
# The kit counts nodes and refuses to guess what one costs in bytes, so
# vaadin.ui.state.size exists only once this is set. The value below was
# measured on this application with UC3's own probe (the "Measure bytes per
# node" button, i.e. HeapCostProbe): a batch of data-bound views retained and
# weighed against MemoryMXBean, median of three rounds. Re-run it after the
# views change shape, since a configured constant cannot notice that they have.
#
# Treat it as an order of magnitude, not a constant of nature. A component's
# data is not part of the node count — a Grid holding a hundred rows is a
# handful of nodes and those rows are most of its weight — so bytes per node
# comes out several times higher for a data-bound view than for a form, and one
# global value can only approximate a mixed application.
vaadin.observability.ui-state-bytes-per-node=4036
